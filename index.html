
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>STORE PC VIRTUAL</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #080817;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  padding: 40px 15px;
  text-align: center;
  background: linear-gradient(135deg, #1111aa, #7900ff, #e00045);
}

header h1 {
  font-size: 32px;
  text-shadow: 0 0 15px #00ccff;
}

header p {
  font-size: 18px;
}

main {
  padding: 25px 15px;
  max-width: 900px;
  margin: auto;
}

h2 {
  text-align: center;
  margin-bottom: 30px;
}

.produto {
  background: #17172d;
  border: 1px solid #593cff;
  border-radius: 18px;
  padding: 15px;
  margin: 25px auto;
  max-width: 500px;
  box-shadow: 0 0 18px #2828aa;
  overflow: hidden;
}

.produto img {
  width: 100%;
  height: 220px;
  object-fit: cover;
  border-radius: 12px;
}

.produto h3 {
  font-size: 25px;
  text-align: center;
}

.preco {
  color: #00eaff;
  font-size: 26px;
  font-weight: bold;
  text-align: center;
}

.descricao {
  text-align: center;
  color: #ccc;
  font-size: 17px;
}

footer {
  padding: 25px;
  color: #aaa;
  text-align: center;
}

</style>
</head>

<body>

<header>
<h1>STORE PC VIRTUAL</h1>
<p>Sua loja virtual de games</p>
</header>

<main>

<h2>🔥 Nossos produtos</h2>

<div class="produto">
<img
src="https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/271590/header.jpg"
alt="GTA V"
>
<h3>GTA V</h3>
<p class="preco">R$ 8,90</p>
<p class="descricao">Produto digital</p>
</div>

<div class="produto">
<img
src="https://images.unsplash.com/photo-1593640408182-31c70c8268f5?w=900"
alt="Computador gamer"
>
<h3>PC VIRTUAL</h3>
<p class="preco">R$ 10,90</p>
<p class="descricao">Produto digital</p>
</div>

</main>

<footer>
© 2026 STORE PC VIRTUAL
</footer>

</body>
</html>
